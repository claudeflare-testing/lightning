# Wiring dei servizi custom.
parameters:
    box.min_lat: '%env(float:BOX_MIN_LAT)%'
    box.max_lat: '%env(float:BOX_MAX_LAT)%'
    box.min_lon: '%env(float:BOX_MIN_LON)%'
    box.max_lon: '%env(float:BOX_MAX_LON)%'
    live.window_seconds: '%env(int:LIVE_WINDOW_SECONDS)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Client Redis condiviso (phpredis).
    Redis:
        class: Redis
        factory: ['App\Factory\RedisFactory', 'create']
        arguments:
            $dsn: '%env(REDIS_DSN)%'

    App\Service\LiveBuffer:
        arguments:
            $redis: '@Redis'
            $windowSeconds: '%live.window_seconds%'

    App\Command\BlitzortungWorkerCommand:
        arguments:
            $minLat: '%box.min_lat%'
            $maxLat: '%box.max_lat%'
            $minLon: '%box.min_lon%'
            $maxLon: '%box.max_lon%'
